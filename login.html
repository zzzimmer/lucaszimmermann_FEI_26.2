<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Minha Loja</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/responsivo.css">
</head>
<body>
<header>
  <nav aria-label="Menu principal">
    <a class="marca-loja" href="index.html">Minha Loja</a>
    <input type="checkbox" id="menu-check" aria-label="Abrir menu">
    <label for="menu-check" class="botao-menu" aria-hidden="true">☰</label>
    <ul>
      <li><a href="vestuario.html">Vestuário</a></li>
      <li><a href="eletronicos.html">Eletrônicos</a></li>
      <li><a href="acessorios.html">Acessórios</a></li>
      <li><a href="sobre.html">Sobre</a></li>

      <li><a href="cadastro.html">Cadastro</a></li>
      <li><a href="contato.html">Contato</a></li>
    </ul>
  </nav>
</header>
<main>
  <h1>Login</h1>
  <section class="cartao">
    <h2>Acesse sua conta</h2>
    <form id="form-login" action="#">
      <fieldset>
        <legend>Acesso à conta</legend>
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="maria@exemplo.com" autocomplete="email" required>
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Sua senha" autocomplete="current-password" required>
      </fieldset>
      <button id="botao-entrar" type="submit" class="botao">Entrar</button>
    </form>
    <p>Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
  </section>
</main>
<footer>
  <p>© 2026 Minha Loja - Florianópolis, SC - contato@minhaloja.com</p>
</footer>
</body>
</html>
