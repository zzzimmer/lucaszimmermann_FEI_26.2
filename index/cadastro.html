<main>
  <h1>Cadastro</h1>
  <section class="cartao">
    <h2>Crie sua conta</h2>
    <form id="form-cadastro" action="#">
      <fieldset>
        <legend>Dados pessoais</legend>
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" placeholder="Maria da Silva" autocomplete="name" required minlength="3" aria-describedby="erro-nome">
        <p class="mensagem-erro" id="erro-nome"></p>
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="maria@exemplo.com" autocomplete="email" required aria-describedby="erro-email">
        <p class="mensagem-erro" id="erro-email"></p>
        <label for="telefone">Telefone (celular com DDD)</label>
        <input type="tel" id="telefone" placeholder="48999990000" inputmode="numeric" autocomplete="tel" maxlength="11" required aria-describedby="erro-telefone">
        <!-- <input> elements of type tel are used to let the user enter and edit a telephone number. Unlike <input type="email"> and <input type="url">, the input value is not automatically validated to a particular format before the form can be submitted, because formats for telephone numbers vary so much around the world. -->
        <p class="mensagem-erro" id="erro-telefone"></p>
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" placeholder="000.000.000-00" inputmode="numeric" autocomplete="off" maxlength="14" required aria-describedby="erro-cpf">
        <p class="mensagem-erro" id="erro-cpf"></p>
      </fieldset>
      <fieldset>
        <legend>Senha</legend>
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Mínimo de 8 caracteres, com letras e números" autocomplete="new-password" required minlength="8" aria-describedby="erro-senha forca-senha">
        <p id="forca-senha" aria-live="polite"></p>
        <p class="mensagem-erro" id="erro-senha"></p>
        <label for="senha2">Confirmação de senha</label>
        <input type="password" id="senha2" placeholder="Repita a senha" autocomplete="new-password" required minlength="8" aria-describedby="erro-senha2">
        <p class="mensagem-erro" id="erro-senha2"></p>
      </fieldset>
      <button id="botao-cadastrar" type="submit" class="botao">Cadastrar</button>
      <p id="mensagem-resultado" role="status"></p>
    </form>
  </section>
</main>
