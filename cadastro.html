    </ul>
  </nav>
</header>
<main>
  <h1>Cadastro</h1>
  <section class="cartao">
    <h2>Crie sua conta</h2>
    <form id="form-cadastro" action="#">
      <fieldset>
        <legend>Dados pessoais</legend>
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" placeholder="Maria da Silva" autocomplete="name" required minlength="3">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="maria@exemplo.com" autocomplete="email" required>
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" placeholder="000.000.000-00" inputmode="numeric" autocomplete="off" required pattern="\d{3}\.?\d{3}\.?\d{3}-?\d{2}" title="Digite o CPF no formato 000.000.000-00">
      </fieldset>
      <fieldset>
        <legend>Senha</legend>
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Mínimo de 8 caracteres" autocomplete="new-password" required minlength="8">
        <label for="senha2">Confirmação de senha</label>
        <input type="password" id="senha2" placeholder="Repita a senha" autocomplete="new-password" required minlength="8">
      </fieldset>
      <button id="botao-cadastrar" type="submit" class="botao">Cadastrar</button>
    </form>
  </section>
</main>
<footer>

</body>
